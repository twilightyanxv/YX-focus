<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1e2a78"/>
      <stop offset="55%" stop-color="#0e1445"/>
      <stop offset="100%" stop-color="#0a0a2e"/>
    </radialGradient>
    <linearGradient id="planet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="target" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="288" height="288" rx="64" fill="url(#bg)"/>

  <g fill="#ffffff" opacity="0.9">
    <circle cx="64" cy="70" r="3.5"/>
    <circle cx="120" cy="48" r="2.5"/>
    <circle cx="250" cy="66" r="3"/>
    <circle cx="270" cy="140" r="2.5"/>
    <circle cx="56" cy="170" r="2.5"/>
    <circle cx="272" cy="210" r="3"/>
    <circle cx="120" cy="272" r="2.5"/>
    <circle cx="210" cy="262" r="3"/>
    <circle cx="46" cy="110" r="2"/>
    <circle cx="284" cy="96" r="2"/>
  </g>

  <g filter="url(#glow)">
    <ellipse cx="160" cy="188" rx="92" ry="26" fill="none" stroke="url(#ring)" stroke-width="9" transform="rotate(-18 160 188)"/>
    <circle cx="160" cy="150" r="64" fill="url(#planet)"/>
  </g>

  <circle cx="160" cy="150" r="40" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="5" stroke-dasharray="12 16" stroke-linecap="round"/>
  <circle cx="160" cy="150" r="26" fill="url(#target)" filter="url(#glow)"/>
  <circle cx="160" cy="150" r="26" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
  <circle cx="160" cy="150" r="9" fill="#ffffff"/>
  <circle cx="160" cy="150" r="9" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>
</svg>
